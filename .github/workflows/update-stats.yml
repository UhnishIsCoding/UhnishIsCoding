name: Update Terminal Stats

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'   # daily at midnight UTC
  workflow_dispatch:        # allows manual "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create assets directory
        run: mkdir -p assets

      - name: Fetch GitHub stats
        run: |
          python3 fetch_stats.py --username "${{ github.repository_owner }}" --output stats.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate terminal SVG
        run: |
          python3 terminal_svg.py --input stats.json --theme tokyonight --output assets/stats.svg

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg stats.json
          git diff --staged --quiet || (git commit -m "chore: update stats [skip ci]" && git push)